<!-- Auth pages (no sidebar) -->
<div *ngIf="!showSidebar">
  <router-outlet />
</div>

<!-- App layout with sidebar -->
<div class="app-layout" *ngIf="showSidebar">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1"></rect>
          </svg>
        </div>
        <span class="logo-text">TaskFlow</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <!-- Admin Navigation -->
      <ng-container *ngIf="isAdmin">
        <div class="nav-section-label nav-stagger" style="--i:0">Management</div>

        <a routerLink="/admin" routerLinkActive="active" class="nav-item nav-stagger" style="--i:1">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>Users</span>
        </a>
      </ng-container>

      <!-- User Navigation -->
      <ng-container *ngIf="!isAdmin">
        <div class="nav-section-label nav-stagger" style="--i:0">Main</div>

        <a routerLink="/projects" routerLinkActive="active" class="nav-item nav-stagger" style="--i:1">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 17a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.9a2 2 0 0 1-1.69-.9l-.81-1.2a2 2 0 0 0-1.67-.9H8a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2Z"></path>
            <path d="M2 8v11a2 2 0 0 0 2 2h14"></path>
          </svg>
          <span>Projects</span>
        </a>

        <a routerLink="/tasks" routerLinkActive="active" class="nav-item nav-stagger" style="--i:2">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="6" height="6" rx="1"></rect>
            <path d="m3 17 2 2 4-4"></path>
            <path d="M13 6h8"></path>
            <path d="M13 12h8"></path>
            <path d="M13 18h8"></path>
          </svg>
          <span>Tasks</span>
        </a>

        <div class="nav-section-label nav-stagger" style="margin-top: 1.5rem; --i:3">Quick Actions</div>

        <a routerLink="/projects/create" routerLinkActive="active" class="nav-item nav-stagger" style="--i:4">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14"></path>
            <path d="M5 12h14"></path>
          </svg>
          <span>New Project</span>
        </a>

        <a routerLink="/tasks/create" routerLinkActive="active" class="nav-item nav-stagger" style="--i:5">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14"></path>
            <path d="M5 12h14"></path>
          </svg>
          <span>New Task</span>
        </a>
      </ng-container>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-footer-content">
        <div class="avatar">{{ authService.getUserInitial() }}</div>
        <div class="user-info">
          <span class="user-name">{{ authService.getUserName() }}</span>
          <span class="user-role">{{ authService.getRole() }}</span>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()" title="Sign out">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <router-outlet />
  </main>
</div>
